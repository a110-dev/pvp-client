name: Build PvP Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: aleksa04-1-4-0-enhanced
        path: build/libs/aleksa04_1-1.4.0.jar
        retention-days: 30

    - name: Upload source ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: aleksa04-1-4-0-source
        path: build/libs/aleksa04_1-1.4.0-sources.jar
        retention-days: 30
